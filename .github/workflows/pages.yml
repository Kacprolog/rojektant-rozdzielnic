# Testy w 4 silnikach (każdy na osobnej maszynie), a po sukcesie publikacja na GitHub Pages.
# Wymaga jednorazowo: Settings → Pages → Source: „GitHub Actions”.
name: Testy i publikacja

on:
  push:
    # gałęzie ci-* służą do eksperymentów diagnostycznych: tylko testy, bez publikacji (deploy wymaga main)
    branches: [main, 'ci-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Każda przeglądarka na osobnej maszynie: równoległe testy czterech silników na jednej maszynie CI spowalniały WebKit
  # (rysowanie programowe, bez akceleracji grafiki) tak, że testy przekraczały limit czasu.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, phone, safari, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # sprawdzanie typów (TypeScript w trybie checkJs, bez kompilacji; strona działa bez zmian)
      - run: npm run typecheck
      - run: npx playwright install --with-deps ${{ matrix.project == 'safari' && 'webkit' || matrix.project == 'firefox' && 'firefox' || 'chromium' }}
      # reporter github zapisuje każdy nieudany test jako adnotację widoczną bez logowania
      - name: Testy
        run: |
          if [[ "$GITHUB_REF" == refs/heads/ci-* && "${{ matrix.project }}" != safari ]]; then
            echo "gałąź ci-*: tylko WebKit"
          elif [[ "$GITHUB_REF" == refs/heads/ci-* ]]; then
            # eksperyment: pomiar czasu klatki w WebKit (scripts/ci-klatki.js), potem testy WebKit raz, bez ponownych prób
            node scripts/ci-klatki.js webkit
            npx playwright test --project=safari --retries=0 --reporter=github,line
          else
            npx playwright test --project=${{ matrix.project }} --reporter=github,line
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-wyniki-${{ matrix.project }}
          path: test-results/

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Publikujemy tylko pliki aplikacji (z czcionkami i ich licencjami), bez testów, dokumentacji i narzędzi.
      - run: mkdir _site && cp -r index.html manifest.webmanifest sw.js css js fonts icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
